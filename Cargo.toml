[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
proto = { path = "crates/proto" }
transport = { path = "crates/transport" }
client-core = { path = "crates/client-core" }
socks5 = { path = "crates/socks5" }
bytes = "1"
thiserror = "2"
base64 = "0.22"
getrandom = "0.3"
sha2 = "0.10"
subtle = "2"
zeroize = { version = "1", features = ["derive"] }
proptest = { version = "1", default-features = false, features = ["std"] }
async-trait = "0.1"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "io-util", "macros"] }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
webpki-roots = "1"
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config"] }
lexopt = "0.3"
rustls-pki-types = { version = "1", features = ["std"] }
socket2 = { version = "0.6", features = ["all"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[workspace.lints.rust]
missing_docs = "warn"

# Server: `cargo build --release -p server`.
[profile.release]
opt-level = 3

# Router client (N5: ≤ 5 MB stripped): `cargo build --profile release-client -p client-openwrt`.
[profile.release-client]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
