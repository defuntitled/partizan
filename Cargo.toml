[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
license = "AGPL-3.0-only"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
proto = { path = "crates/proto" }
transport = { path = "crates/transport" }
client-core = { path = "crates/client-core" }
socks5 = { path = "crates/socks5" }
server = { path = "crates/server" }
tun = { path = "crates/tun" }
client-ffi = { path = "crates/client-ffi" }
bytes = "1"
thiserror = "2"
base64 = "0.22"
getrandom = "0.3"
sha2 = "0.10"
subtle = "2"
zeroize = { version = "1", features = ["derive"] }
proptest = { version = "1", default-features = false, features = ["std"] }
async-trait = "0.1"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
quinn-proto = { version = "0.11", default-features = false }
ring = "0.17"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "io-util", "macros"] }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
webpki-roots = "1"
boring = "5"
boring-sys = "5"
foreign-types = "0.5"
brotli-decompressor = "6"
tokio-boring = "5"
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["std", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config"] }
lexopt = "0.3"
libc = "0.2"
qrcode = { version = "0.14", default-features = false }
log = "0.4"
rustls-pki-types = { version = "1", features = ["std"] }
socket2 = { version = "0.6", features = ["all"] }
# Mobile bindings (Kotlin now, Swift later) for `client-ffi`.
uniffi = "0.32"
# Userspace TCP for the TUN source; UDP is parsed by hand, so no `socket-udp`.
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[workspace.lints.rust]
missing_docs = "warn"

# Server: `cargo build --release -p server`.
[profile.release]
opt-level = 3

# Router client (N5: ≤ 5 MB stripped): `cargo build --profile release-client -p client-openwrt`.
[profile.release-client]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Mobile library: `cargo ndk ... build --profile release-ffi -p client-ffi`. Unlike
# `release-client`, panics unwind, so UniFFI turns them into exceptions instead of killing the app.
[profile.release-ffi]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
