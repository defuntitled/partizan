name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The NDK the Android core is built and tested with (also ../partizan-ui).
  ANDROID_NDK_VERSION: 28.2.13676358
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  installers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash installers
        run: |
          for script in scripts/install-{common,server,client}.sh; do
            bash -n "$script"
          done
          shellcheck -x scripts/install-{common,server,client}.sh
      - name: Exercise installation and upgrade with a fake OS and release
        run: python3 scripts/test-installers.py

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo install cargo-fuzz --locked
      - name: Short run of every fuzz target
        run: |
          for target in $(cargo +nightly fuzz list); do
            cargo +nightly fuzz run "$target" -- -max_total_time=30 -rss_limit_mb=512
          done

  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - run: cargo install cargo-zigbuild --locked
      - name: Headers for BoringSSL bindgen when cross-compiling
        run: |
          lib=$(zig env | jq -r .lib_dir)
          echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_unknown_linux_musl=-I$lib/libc/include/aarch64-linux-musl -I$lib/libc/include/generic-musl -I$lib/libc/include/any-linux-any" >> "$GITHUB_ENV"
      - name: Router client (aarch64 musl, size profile)
        run: cargo zigbuild --locked --profile release-client -p client-openwrt --target aarch64-unknown-linux-musl
      - name: Server (x86_64 musl)
        run: cargo zigbuild --locked --release -p server --target x86_64-unknown-linux-musl
      - name: Client size budget (N5, 5 MB)
        run: scripts/check-size.sh target/aarch64-unknown-linux-musl/release-client/partizan 5242880
      - name: Static linking
        run: file target/aarch64-unknown-linux-musl/release-client/partizan | grep -q "statically linked"
      - name: Size report (host build, symbols kept)
        run: |
          cargo install cargo-bloat --locked
          CARGO_PROFILE_RELEASE_CLIENT_STRIP=false cargo bloat --profile release-client -p client-openwrt --crates -n 25

  # A03: the generated Kotlin bindings, called from the JVM.
  ffi-jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: scripts/ffi-kotlin-test.sh

  # A04: client-ffi for Android (arm64-v8a) with BoringSSL, packed with its Kotlin API in an AAR.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Install the pinned NDK
        # Not the runner's latest: NDK r30 rejects the unversioned clang target bindgen uses for
        # BoringSSL ("Unversioned target triples are not supported"). This is the one tested.
        run: |
          ndk="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          if [[ ! -d "$ndk" ]]; then
            # Answers from a process substitution, not a pipe: with pipefail a pipe from `yes`
            # fails on SIGPIPE once sdkmanager is done. Output stays visible for diagnosis.
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ANDROID_NDK_VERSION" < <(yes)
          fi
          test -f "$ndk/source.properties" || { echo "NDK $ANDROID_NDK_VERSION missing at $ndk" >&2; exit 1; }
          grep Pkg.Revision "$ndk/source.properties"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - name: Build the AAR
        run: scripts/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: partizan-core-aar
          path: target/android/partizan-core.aar
