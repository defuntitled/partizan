[package]
name = "transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Client TLS over TCP on BoringSSL with Chrome's ClientHello (the server stays on rustls).
chrome = [
    "dep:boring",
    "dep:boring-sys",
    "dep:tokio-boring",
    "dep:brotli-decompressor",
    "dep:foreign-types",
    "dep:webpki",
    "dep:quinn-proto",
]

[dependencies]
async-trait.workspace = true
boring = { workspace = true, optional = true }
boring-sys = { workspace = true, optional = true }
brotli-decompressor = { workspace = true, optional = true }
bytes.workspace = true
foreign-types = { workspace = true, optional = true }
proto.workspace = true
quinn.workspace = true
quinn-proto = { workspace = true, optional = true }
ring.workspace = true
zeroize.workspace = true
rustls.workspace = true
webpki = { workspace = true, optional = true }
serde.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-boring = { workspace = true, optional = true }
tokio-rustls.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
rcgen.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
toml.workspace = true

[lints]
workspace = true
